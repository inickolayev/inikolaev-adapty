# Minimal stack for the auth service: backend + Postgres + Redis.
# The `server` service inherits its build config from the `app` service in docker-compose.base.yml.
# Database ports are NOT published to the host — services talk over the compose network.

services:
    server:
        extends:
            file: docker-compose.base.yml
            service: app
        command: python manage.py runserver
        ports:
            - 8010:8000
        depends_on:
            - postgres
            - redis

    postgres:
        image: postgres:16.2-alpine
        env_file:
            - .env.docker

    redis:
        image: redis/redis-stack:7.2.0-v13
